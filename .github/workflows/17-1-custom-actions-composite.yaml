name: 17 - 1 - Custom Actions - Composite
run-name: 17 - 1 - Custom Actions - Composite | Env ${{ inputs.target-env }}

on:
  workflow_dispatch:
    inputs:
      target-env:
        description: 'Select the target environment'
        type: choice
        options:
          - dev
          - prod

env:
  working-directory: "17-custom-actions/react-app"
  
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.working-directory }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
      
      - name: "Use custom composite action to cache dependencies"
        uses: ./.github/actions/composite-cache-deps
        with:
          node-version: '20.x'
          working-dir: ${{ env.working-directory }}
          # key: node_modules-${{ hashFiles(format('{0}/{1}', inputs.working-dir, 'package-lock.json')) }}

      - name: "Tests"
        run: npm run test

      - name: "Build"
        run: npm run build
        
      